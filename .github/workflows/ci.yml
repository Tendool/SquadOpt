name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Model, API and agent tests (synthetic data, no LLM needed)
        run: pytest -q -rf --tb=short
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Front-end syntax check
        run: for f in static/js/*.js; do node --check "$f"; done
